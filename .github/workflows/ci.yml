name: Quality, tests and distribution
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: pip install poetry==2.5.1
      - run: poetry install --no-interaction
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run pytest --cov=telcoguard --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75
      - run: poetry build
      - run: poetry run sphinx-build -W -b html docs docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: reports-python-${{ matrix.python }}
          path: |
            htmlcov/
            coverage.xml
            dist/
            docs/_build/html/
