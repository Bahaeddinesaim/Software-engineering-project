[project]
name = "telcoguard-ai"
version = "1.0.0"
description = "API reproductible de prédiction du churn télécom"
authors = [{name = "SAIM Bahaeddine"}]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "uvicorn>=0.30,<1",
    "joblib>=1.4,<2",
    "httpx>=0.27,<1",
]

[tool.poetry]
packages = [{include = "telcoguard", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = ">=8,<10"
pytest-cov = ">=5,<8"
ruff = ">=0.9,<1"
pre-commit = ">=4,<5"
sphinx = ">=8,<9"
nbclient = ">=0.10,<1"
ipykernel = ">=6,<8"

[project.scripts]
telcoguard = "telcoguard.cli:main"

[build-system]
requires = ["poetry-core>=2.0,<3"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=telcoguard --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=75"
